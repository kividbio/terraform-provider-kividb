# Builds the release artefacts the Terraform Registry expects: one archive per
# platform, a SHA256SUMS file, and a detached GPG signature over that file. The
# registry verifies the signature against the public key you upload once, which
# is what lets it serve the provider as yours.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # Reproducible: no build timestamp, and the version comes from the tag.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos: [freebsd, windows, linux, darwin]
    goarch: [amd64, "386", arm, arm64]
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # The manifest is checksummed alongside the archives, so the signature covers
  # it too. A protocol version the registry trusts but nobody signed would be a
  # gap in exactly the chain this signing exists to close.
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Without this file the registry assumes protocol 5.0, and this provider is
  # built on terraform-plugin-framework, which serves 6.0. The mismatch is not
  # visible at publish time -- it surfaces as a protocol error in somebody
  # else's `terraform init`, against a version number that can never be
  # withdrawn.
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # The registry reads the changelog from the GitHub release body.
  draft: false

changelog:
  disable: true
